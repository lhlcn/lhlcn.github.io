<script>
(function(){
  "use strict";
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* 复制邮箱 */
  var btn = document.getElementById("mailbtn");
  var hint = document.getElementById("hint");
  var DEF = "合作 / 反馈，点击复制邮箱";
  function done(){
    hint.textContent = "已复制：" + btn.getAttribute("data-mail");
    hint.style.color = "#f2c24d";
    setTimeout(function(){ hint.textContent = DEF; hint.style.color = ""; }, 2600);
  }
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = btn.getAttribute("data-mail");
    ta.setAttribute("readonly","");
    ta.style.position = "fixed"; ta.style.top = "-1000px";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); }
    catch(e){ hint.textContent = btn.getAttribute("data-mail"); }
    document.body.removeChild(ta);
  }
  btn.addEventListener("click", function(){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(btn.getAttribute("data-mail")).then(done, fallback);
    } else { fallback(); }
  });

  /* 金色上升粒子 */
  var cv = document.getElementById("fx");
  if(cv && !reduce){
    var ctx = cv.getContext("2d"), W = 0, H = 0, ps = [], raf = null;
    var DPR = Math.min(window.devicePixelRatio || 1, 2);
    function mk(init){
      return { x: Math.random()*W, y: init ? Math.random()*H : H + 14,
        r: Math.random()*1.7 + .5, vy: -(Math.random()*.42 + .14),
        vx: (Math.random()-.5)*.3, a: Math.random()*.55 + .16,
        ph: Math.random()*Math.PI*2, sp: Math.random()*.017 + .006 };
    }
    function size(){
      var r = document.querySelector(".stage").getBoundingClientRect();
      W = r.width; H = r.height;
      if(!W || !H) return;
      cv.width = W * DPR; cv.height = H * DPR;
      ctx.setTransform(DPR,0,0,DPR,0,0);
      var n = W < 760 ? 30 : 58;
      ps = []; for(var i=0;i<n;i++) ps.push(mk(true));
    }
    function tick(){
      ctx.clearRect(0,0,W,H);
      for(var i=0;i<ps.length;i++){
        var p = ps[i];
        p.x += p.vx + Math.sin(p.ph)*0.18; p.y += p.vy; p.ph += p.sp;
        if(p.y < -16 || p.x < -24 || p.x > W + 24) ps[i] = mk(false);
        var al = p.a * (0.5 + 0.5*Math.sin(p.ph));
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fillStyle = "rgba(255," + (185 + Math.round(p.r*26)) + ",90," + al.toFixed(3) + ")";
        ctx.shadowBlur = 10; ctx.shadowColor = "rgba(255,180,60,.8)";
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      raf = requestAnimationFrame(tick);
    }
    size(); tick();
    var t;
    window.addEventListener("resize", function(){ clearTimeout(t); t = setTimeout(size, 200); });
    document.addEventListener("visibilitychange", function(){
      if(document.hidden){ if(raf) cancelAnimationFrame(raf); raf = null; }
      else if(!raf){ tick(); }
    });
  }
})();
</script>
